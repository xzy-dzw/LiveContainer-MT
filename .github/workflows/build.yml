name: 构建 IPA

# 构建流程严格跟随 LiveContainer 官方预发行版：
#   同一个 xcodebuild archive 产物，经 .github/build_github.sh 分别打包成
#   LiveContainer.ipa（单文件版）和 LiveContainer+SideStore.ipa（二合一版）。
# 推送到 main 或提交 PR 时只做构建验证；发布中文 Release 需要手动执行工作流并勾选发布。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 构建完成后发布中文 Release
        type: boolean
        default: false
      release_tag:
        description: Release 标签名（例如 mt-v4.0.0）
        type: string
        required: false
      release_title:
        description: Release 标题
        type: string
        required: false
      release_notes:
        description: Release 说明（中文，支持多行 Markdown）
        type: string
        required: false

jobs:
  build:
    name: 构建双版本 IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - name: 选择 Xcode 版本
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: 检出源码（含子模块）
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: 确定构建 Scheme
        id: scheme
        run: |
          if [ $scheme = default ]
          then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
            echo 使用默认 scheme: $scheme
          else
            echo 使用指定 scheme: $scheme
          fi
          echo "scheme=$scheme" >> $GITHUB_OUTPUT
      - name: 判断工程类型
        id: filetype_parameter
        run: |
          filetype_parameter=`ls -A | grep -i \\.xcworkspace\$ && echo workspace || echo project`
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
      - name: 定位工程文件
        id: file_to_build
        run: |
          file_to_build=`ls -A | grep -i \\.xcworkspace\$ || ls -A | grep -i \\.xcodeproj\$`
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT
      - name: 写入本次构建的提交号
        run: /usr/libexec/PlistBuddy -c "Set :LCBuildCommit ${GITHUB_SHA:0:7}" LiveContainer/Info.plist
      - name: 归档编译（Release）
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: set -o pipefail; xcodebuild archive -archivePath "$archive_path" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -sdk iphoneos -arch arm64 -configuration Release
      - name: 打包归档产物
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"
      - name: 上传归档产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive_path }}.xcarchive.tar
          path: ${{ env.archive_path }}.xcarchive.tar
      - name: 生成单文件版与二合一版 IPA
        run: |
          sh .github/build_github.sh
      - name: 上传单文件版 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa
          if-no-files-found: error
      - name: 上传二合一版 IPA（LiveContainer+SideStore）
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}+SideStore.ipa
          path: ${{ env.scheme }}+SideStore.ipa
          if-no-files-found: error

  publish_release:
    name: 发布中文 Release
    needs: [build]
    if: ${{ inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
      - name: 下载单文件版 IPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
      - name: 下载二合一版 IPA
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact2 }}
      - name: 生成发行说明文件
        env:
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -eu
          test -n "$RELEASE_TAG"
          test -n "$RELEASE_TITLE"
          printf '%s\n' "$RELEASE_NOTES" > RELEASE_NOTES.md
          echo "准备发布: $RELEASE_TAG / $RELEASE_TITLE"
          ls -lh *.ipa
      - name: 创建 GitHub Release 并上传双 IPA
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_title }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ needs.build.outputs.artifact }}
            ${{ needs.build.outputs.artifact2 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

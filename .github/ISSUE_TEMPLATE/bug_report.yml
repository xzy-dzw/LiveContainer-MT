name: 问题反馈
description: 反馈多任务版 LiveContainer 的 Bug 或使用问题
title: "[问题] "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: 使用的安装包
      options:
        - 单文件版 LiveContainer.ipa
        - 二合一版 LiveContainer+SideStore.ipa
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 多任务版版本号
      description: 在 App 内关于页面或 Release 标签查看，例如 mt-v4.0.0
      placeholder: mt-v4.0.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统版本
      placeholder: 例如 iPhone 13 Pro Max / iOS 26.7
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 出现了什么问题？预期应该是什么表现？
      placeholder: 尽量描述清楚现象、出现频率、能否稳定复现
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 截图、录屏、日志等（可直接粘贴图片）
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        > 说明：本仓库仅维护多任务功能。LiveContainer 本体与 SideStore 上游的问题请反馈给对应官方仓库。
